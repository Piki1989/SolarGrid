<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolarGrid</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d0d7de;
    --accent: #f5a524; --accent-fg: #1f2328; --pv: #ff3b30; --bld: #0a84ff;
    --shadow: 0 2px 6px rgba(0,0,0,.25);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1f24; --fg: #e6edf3; --muted: #9aa4af; --line: #30363d; --shadow: 0 2px 8px rgba(0,0,0,.6); }
  }
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; top: 12px; left: 12px; width: min(380px, calc(100% - 24px)); z-index: 2; display: flex; flex-direction: column; gap: 8px; }
  .search { display: flex; background: var(--bg); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; }
  .search input { flex: 1; border: 0; padding: 12px 16px; font: inherit; color: var(--fg); background: transparent; outline: none; }
  .search button { border: 0; background: var(--accent); color: var(--accent-fg); padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer; }
  .card { background: var(--bg); border-radius: 12px; box-shadow: var(--shadow); padding: 14px 16px; display: none; }
  .card h2 { margin: 0 0 2px; font-size: 16px; }
  .card .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .kwp { font-size: 32px; font-weight: 700; }
  .kwp small { font-size: 14px; font-weight: 400; color: var(--muted); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 10px 0 0; }
  dt { color: var(--muted); } dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .photo { position: relative; margin: 0 -16px 10px; cursor: pointer; }
  .photo img { display: block; width: 100%; height: auto; }
  .photo .tag { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 10px; }
  .card { max-height: calc(100vh - 100px); overflow-y: auto; }
  .examples { background: var(--bg); border-radius: 12px; box-shadow: var(--shadow); padding: 10px 12px; }
  .examples h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .examples button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--fg); font: inherit; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  .examples button:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .status { padding: 6px 10px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 20%, transparent); }
  .layers { position: absolute; bottom: 24px; left: 12px; z-index: 2; background: var(--bg); border-radius: 10px; box-shadow: var(--shadow); padding: 8px 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; max-width: calc(100% - 24px); }
  .layers label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
  .layers select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.8s linear infinite; vertical-align: -2px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <form class="search" id="search">
    <input id="q" placeholder="Adres, np. Kraków, Floriańska 3" autocomplete="off">
    <button>Szukaj</button>
  </form>
  <div class="card" id="card"></div>
  <div class="examples" id="examples">
    <h3>Przykładowe adresy z instalacją PV</h3>
  </div>
</div>
<div class="layers">
  <label><input type="radio" name="base" value="ortho" checked> Ortofoto</label>
  <label><input type="radio" name="base" value="osm"> Mapa</label>
  <label>Rok <select id="year"><option value="">najnowszy</option></select></label>
  <label><input type="checkbox" id="det" checked> Wykryte PV</label>
</div>
<script>
const GUGIK = "https://mapy.geoportal.gov.pl/wss/service/PZGIK/ORTO/WMS/";
const wms = (svc, extra = "", fmt = "image/jpeg") => `${GUGIK}${svc}?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0&LAYERS=Raster&STYLES=&FORMAT=${fmt}&CRS=EPSG:3857&BBOX={bbox-epsg-3857}&WIDTH=256&HEIGHT=256${extra}`;

const yearSel = document.getElementById("year");
for (let y = 2025; y >= 2010; y--) yearSel.add(new Option(y, y));

const map = new maplibregl.Map({
  container: "map",
  center: [19.94, 50.06], zoom: 11, maxZoom: 21,
  style: {
    version: 8,
    sources: {
      osm: { type: "raster", tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"], tileSize: 256, maxzoom: 19,
             attribution: "© OpenStreetMap" },
      // HighResolution ma dziury (białe prostokąty) — pod spodem StandardResolution z całego kraju.
      ortho_std: { type: "raster", tiles: [wms("StandardResolutionTime")], tileSize: 256 },
      ortho: { type: "raster", tiles: [wms("HighResolution", "&TRANSPARENT=TRUE", "image/png")], tileSize: 256, attribution: "Ortofotomapa © GUGiK" },
    },
    layers: [
      { id: "osm", type: "raster", source: "osm", layout: { visibility: "none" } },
      { id: "ortho_std", type: "raster", source: "ortho_std" },
      { id: "ortho", type: "raster", source: "ortho" },
    ],
  },
});
map.addControl(new maplibregl.NavigationControl(), "top-right");
map.addControl(new maplibregl.ScaleControl({ unit: "metric" }), "bottom-right");

const empty = { type: "FeatureCollection", features: [] };
map.on("load", () => {
  map.addSource("det", { type: "geojson", data: empty });
  map.addLayer({ id: "det", type: "fill", source: "det", minzoom: 14, paint: { "fill-color": "#ff3b30", "fill-opacity": 0.45 } });
  map.addSource("bld", { type: "geojson", data: empty });
  map.addLayer({ id: "bld", type: "line", source: "bld", paint: { "line-color": "#0a84ff", "line-width": 3 } });
  map.addSource("pv", { type: "geojson", data: empty });
  map.addLayer({ id: "pv-fill", type: "fill", source: "pv", paint: { "fill-color": "#ff3b30", "fill-opacity": 0.5 } });
  map.addLayer({ id: "pv-line", type: "line", source: "pv", paint: { "line-color": "#ffffff", "line-width": 1.5 } });
  refreshDetections();
});

document.querySelectorAll("input[name=base]").forEach(r => r.addEventListener("change", () => {
  const ortho = r.value === "ortho" && r.checked;
  map.setLayoutProperty("ortho", "visibility", ortho ? "visible" : "none");
  map.setLayoutProperty("ortho_std", "visibility", ortho ? "visible" : "none");
  map.setLayoutProperty("osm", "visibility", ortho ? "none" : "visible");
}));
yearSel.addEventListener("change", () => {
  const y = yearSel.value;
  map.getSource("ortho").setTiles([y ? wms("StandardResolutionTime", `&TIME=${y}-12-31`) : wms("HighResolution")]);
});
document.getElementById("det").addEventListener("change", e =>
  map.setLayoutProperty("det", "visibility", e.target.checked ? "visible" : "none"));

let detTimer;
map.on("moveend", () => { clearTimeout(detTimer); detTimer = setTimeout(refreshDetections, 300); });
async function refreshDetections() {
  if (map.getZoom() < 14 || !map.getSource("det")) return;
  const b = map.getBounds();
  const r = await fetch(`/api/detections?bbox=${b.getWest()},${b.getSouth()},${b.getEast()},${b.getNorth()}`);
  if (r.ok) map.getSource("det").setData(await r.json());
}

const card = document.getElementById("card");
const fmt = (v, d = 1) => v == null ? "–" : Number(v).toLocaleString("pl-PL", { maximumFractionDigits: d });
const STATUS = {
  nie_znaleziono_adresu: "Nie znaleziono adresu.",
  brak_budynku: "Pod tym adresem nie ma budynku w ewidencji.",
  brak_ortofoto: "Brak pobranej ortofotomapy dla tego miejsca.",
  brak_pv: "Nie wykryto paneli PV na tym dachu.",
};
const ASPECT = d => d == null ? "–" : ["N", "NE", "E", "SE", "S", "SW", "W", "NW"][Math.round(d / 45) % 8] + ` (${fmt(d, 0)}°)`;

function showOnMap(res) {
  map.getSource("bld").setData(res.budynek ? { type: "Feature", geometry: res.budynek } : empty);
  map.getSource("pv").setData({ type: "FeatureCollection",
    features: (res.panele || []).map(g => ({ type: "Feature", geometry: g })) });
  if (res.budynek) {
    // Polygon: [pierścień, ...]; MultiPolygon (np. biurowce z EGiB): [[pierścień, ...], ...]
    const g = res.budynek;
    const cs = (g.type === "MultiPolygon" ? g.coordinates.map(p => p[0]) : [g.coordinates[0]]).flat();
    const b = cs.reduce((bb, c) => bb.extend(c), new maplibregl.LngLatBounds(cs[0], cs[0]));
    map.fitBounds(b, { padding: 120, maxZoom: 20 });
  } else if (res.punkt) map.flyTo({ center: res.punkt, zoom: 19 });
}

function show(res) {
  card.style.display = "block";
  // Warstwy powstają w map.on("load"), które czeka na kafelki WMS — karta nie czeka na mapę.
  if (map.getSource("bld")) showOnMap(res); else map.once("load", () => showOnMap(res));

  const title = res.adres || `Budynek ${res.budynek_id || ""}`;
  // Zdjęcie, na którym liczył model (podkład mapy może być z innego nalotu). Klik: z/bez paneli.
  const photo = res.zdjecie_panele ? `
    <div class="photo" id="photo" title="Kliknij, aby przełączyć">
      <img src="${res.zdjecie_panele}" alt="Zdjęcie dachu z wykrytymi panelami">
      <span class="tag">wykryte panele · kliknij: samo zdjęcie</span>
    </div>` : "";
  const o = res.ortofoto || {};
  if (res.status !== "ok") {
    card.innerHTML = `<h2>${title}</h2>${o.data_nalotu ? `<div class="sub">Ortofoto ${o.data_nalotu} · ${fmt(o.piksel_zrodla_m * 100, 0)} cm/px</div>` : ""}
      ${photo}<div class="status">${STATUS[res.status] || res.status}</div>`;
    bindPhoto(res);
    return;
  }
  card.innerHTML = `
    <h2>${title}</h2>
    <div class="sub">Ortofoto ${o.data_nalotu} · ${fmt(o.piksel_zrodla_m * 100, 0)} cm/px</div>
    ${photo}
    <div class="kwp">${fmt(res.moc_kwp)} <small>kWp (${fmt(res.moc_kwp_zakres[0])}–${fmt(res.moc_kwp_zakres[1])})</small></div>
    <dl>
      <dt>Powierzchnia paneli</dt><dd>${fmt(res.powierzchnia_m2)} m²</dd>
      <dt>w rzucie</dt><dd>${fmt(res.powierzchnia_rzut_m2)} m²</dd>
      <dt>Nachylenie dachu</dt><dd>${fmt(res.nachylenie_deg)}°</dd>
      <dt>Ekspozycja</dt><dd>${ASPECT(res.ekspozycja_deg)}</dd>
      <dt>Budynek</dt><dd>${fmt(res.powierzchnia_budynku_m2)} m²</dd>
    </dl>`;
  bindPhoto(res);
}

function bindPhoto(res) {
  const el = document.getElementById("photo");
  if (!el) return;
  let withPv = true;
  el.addEventListener("click", () => {
    withPv = !withPv;
    el.querySelector("img").src = withPv ? res.zdjecie_panele : res.zdjecie;
    el.querySelector(".tag").textContent = withPv ? "wykryte panele · kliknij: samo zdjęcie" : "samo zdjęcie · kliknij: wykryte panele";
  });
}

async function run(url) {
  examples.style.display = "none";
  card.style.display = "block";
  card.innerHTML = `<span class="spin"></span> Analizuję dach…`;
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    show(await r.json());
  } catch (e) {
    card.innerHTML = `<div class="status">Błąd: ${e.message}</div>`;
  }
}
document.getElementById("search").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  history.replaceState(null, "", `?q=${encodeURIComponent(q)}`);  // link do wyniku
  run(`/api/estimate?q=${encodeURIComponent(q)}`);
});
// Adresy z instalacją w OSM, dla których są pobrane zdjęcia (sprawdzone 28.10.2026).
const EXAMPLES = [
  "Kraków, Rysi Stok 12",
  "Kraków, Kazimierza Wyżgi 7",
  "Kraków, prof. Michała Życzkowskiego 33",
  "Tarnów, Jabłoniowa 3",
  "Limanowa, Mikołaja Kopernika 5b",
  "Rząska, Klubowa 15",
];
const examples = document.getElementById("examples");
for (const a of EXAMPLES) {
  const b = document.createElement("button");
  b.textContent = a;
  b.addEventListener("click", () => {
    document.getElementById("q").value = a;
    document.getElementById("search").requestSubmit();
  });
  examples.append(b);
}
const initialQ = new URLSearchParams(location.search).get("q");
if (initialQ) {
  document.getElementById("q").value = initialQ;
  run(`/api/estimate?q=${encodeURIComponent(initialQ)}`);
}
map.on("click", e => {
  if (map.getZoom() >= 17) run(`/api/estimate_xy?lon=${e.lngLat.lng}&lat=${e.lngLat.lat}`);
});
</script>
</body>
</html>
